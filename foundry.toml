[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.29"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
fs_permissions = [{ access = "read", path = "./" }]

[rpc_endpoints]
reactive_lasna = "https://lasna-rpc.rnk.dev/"
base_sepolia = "${BASE_SEPOLIA_RPC}"

[etherscan]
base_sepolia = { key = "", url = "https://api-sepolia.basescan.org/api" }
